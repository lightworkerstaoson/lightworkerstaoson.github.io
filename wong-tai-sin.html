<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>黃大仙靈籤 模擬求籤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
:root{
  --page:#DCE1DE; --page-ink:#1F2A2A;
  --display:"Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --kai:"LXGW WenKai TC","Kaiti TC","STKaiti","BiauKai","DFKai-SB","Noto Serif TC","Noto Serif CJK TC","Source Han Serif TC","Songti TC",serif;
  --gold:#E6B24A; --gold-soft:#F3D58E; --vermilion:#A8261C; --mist:#F5F1E6;
  --grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .22 0 0 0 0 .1 0 0 0 .16 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#061112;--page-ink:#D8D3C4;}}
:root[data-theme="dark"]{--page:#061112;--page-ink:#D8D3C4;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;height:100%;background:var(--page);color:var(--page-ink);font-family:var(--kai);-webkit-font-smoothing:antialiased;overflow:hidden;}
.stage-wrap{height:100%;container-type:size;display:grid;place-items:center;}
.frame{position:relative;width:min(100cqw,100cqh * .5625);height:min(100cqh,100cqw * 2.17);overflow:hidden;overflow:clip;container-type:size;background:#1A1410;isolation:isolate;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;}
@media (min-width:640px){.frame{border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);}}

/* ---------- temple courtyard ---------- */
.sky{position:absolute;inset:0;background:radial-gradient(60cqw 18cqh at 50% 28%,rgba(255,214,140,.55),transparent 70%),linear-gradient(180deg,#2F5A57 0%,#7F8663 20%,#CFA15E 36%,#B7834C 48%,#6B4C36 70%);}
.hall{position:absolute;top:6.5cqh;left:0;width:100%;aspect-ratio:400/250;display:block;}
.plaza{position:absolute;left:0;top:calc(6.5cqh + 62.5cqw - 1px);bottom:0;width:100%;height:auto;display:block;}
.censer{position:absolute;left:50%;bottom:50cqh;width:32cqw;margin-left:-16cqw;aspect-ratio:200/280;overflow:visible;display:block;}
.haze{position:absolute;inset:-10% -20%;pointer-events:none;background:radial-gradient(40cqw 12cqh at 32% 34%,rgba(255,240,215,.2),transparent 70%),radial-gradient(50cqw 14cqh at 68% 44%,rgba(255,240,215,.16),transparent 70%);animation:drift 18s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .28s steps(2) infinite alternate;}
@keyframes flick{from{transform:scaleY(.82)}to{transform:scaleY(1.05)}}
.halo{animation:breathe 3.2s ease-in-out infinite alternate;}
@keyframes breathe{from{opacity:.65}to{opacity:1}}
.puff{opacity:.42;stroke-dasharray:46 24;animation:puff 6.5s ease-in-out infinite,flow 3.2s linear infinite;}
.puff:nth-child(2){animation-delay:-2.2s,-1s;}
.puff:nth-child(3){animation-delay:-4.3s,-2s;}
@keyframes puff{0%{opacity:0;transform:translateY(14px)}25%{opacity:.6}70%{opacity:.3}100%{opacity:0;transform:translateY(-36px)}}
@keyframes flow{to{stroke-dashoffset:-140}}
.tip{animation:ember 1.6s ease-in-out infinite alternate;}
@keyframes ember{from{opacity:.5}to{opacity:1}}
#mine{opacity:0;transition:opacity .9s ease;}
.censer.mine #mine{opacity:1;}

/* ---------- foreground (what's in your hands) ---------- */
.fgi{position:absolute;inset:0;z-index:3;opacity:0;visibility:hidden;transform:translateY(8cqh);pointer-events:none;transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s linear .6s;}
.frame[data-step="ask"] .w-tube,.frame[data-step="pray"] .w-tube,.frame[data-step="shake"] .w-tube,
.frame[data-step="incense"] .w-inc,.frame[data-step="cup"] .w-cups,.frame[data-step="result"] .w-cups{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s;}
.tube{position:absolute;left:50%;bottom:15cqh;width:40cqw;margin-left:-20cqw;aspect-ratio:200/300;overflow:visible;display:block;transform-origin:50% 85%;transform:rotate(-7deg);}
.frame[data-step="shake"] .tube{pointer-events:auto;cursor:grab;touch-action:none;}
.tube.shaking{animation:shakeTube .16s ease-in-out infinite alternate;}
@keyframes shakeTube{from{transform:rotate(-13deg) translate(-1.4cqw,.6cqh)}to{transform:rotate(-1deg) translate(1.4cqw,-.8cqh)}}
.tube.shaking .st{animation:jig .1s steps(2) var(--d) infinite;}
@keyframes jig{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.incense{position:absolute;left:50%;bottom:16cqh;width:14cqw;margin-left:-7cqw;aspect-ratio:60/200;overflow:visible;display:block;}
.incense .tipI{fill:#4A2A1C;transition:fill .4s ease;}
.incense.lit .tipI{fill:#FFB14A;animation:ember 1.2s ease-in-out infinite alternate;}
.incense .ismoke{opacity:0;transition:opacity 1s ease .3s;}
.incense.lit .ismoke{opacity:1;}
.cups{position:absolute;left:0;right:0;bottom:30cqh;display:flex;justify-content:center;gap:4cqw;}
.cup{width:24cqw;aspect-ratio:80/50;overflow:visible;display:block;}
.cup[data-face="flat"] .f-round,.cup[data-face="round"] .f-flat{display:none;}
.fly{position:absolute;left:0;top:0;z-index:4;width:2cqw;height:17cqw;border-radius:.8cqw;background:linear-gradient(90deg,#B8843F,#E9CC8E 40%,#A87434);opacity:0;pointer-events:none;box-shadow:0 .6cqh 1cqh rgba(0,0,0,.35);}
.fly::before{content:"";position:absolute;left:0;right:0;top:0;height:22%;border-radius:.8cqw .8cqw 0 0;background:var(--vermilion);}
.slip{position:absolute;left:50%;top:34cqh;z-index:6;width:12cqw;height:40cqh;margin-left:-6cqw;border-radius:1.4cqw;background:linear-gradient(90deg,#B8843F,#EDD39A 35%,#D9AE66 70%,#A87434);box-shadow:0 2cqh 5cqh rgba(0,0,0,.5);display:flex;justify-content:center;opacity:0;visibility:hidden;transform:scale(.4) rotate(70deg);transition:opacity .4s ease,transform .6s cubic-bezier(.2,.9,.3,1.15),visibility 0s linear .6s;pointer-events:none;overflow:hidden;}
.slip::before{content:"";position:absolute;left:0;right:0;top:0;height:5cqh;background:var(--vermilion);}
.slip.show{opacity:1;visibility:visible;transform:rotate(-4deg);transition:opacity .4s ease,transform .6s cubic-bezier(.2,.9,.3,1.15),visibility 0s;}
.slip span{writing-mode:vertical-rl;white-space:nowrap;height:max-content;margin-top:8cqh;font:700 min(7.4cqw,3.8cqh)/1 var(--kai);letter-spacing:.12em;color:#8E1B13;}

/* ---------- top bar ---------- */
.top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:2cqw;padding:1.6cqh 4cqw 2.4cqh;background:linear-gradient(to bottom,rgba(10,18,18,.62),rgba(10,18,18,0));}
.steps{display:flex;gap:2.6cqw;list-style:none;margin:0;padding:0;font:400 min(3.7cqw,1.9cqh)/1 var(--kai);color:rgba(245,241,230,.45);}
.steps li{position:relative;white-space:nowrap;transition:color .3s ease;}
.steps li.done{color:rgba(245,241,230,.78);}
.steps li.now{color:var(--gold-soft);font-weight:700;}
.steps li.now::after{content:"";position:absolute;left:50%;bottom:-1.1cqh;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--gold-soft);}
.mute{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid rgba(245,241,230,.35);background:rgba(8,16,18,.45);color:var(--mist);display:grid;place-items:center;cursor:pointer;padding:0;}
.mute svg{width:18px;height:18px;fill:currentColor;}
.mute .i-off{display:none;}
.mute[aria-pressed="true"] .i-on{display:none;}
.mute[aria-pressed="true"] .i-off{display:block;}

/* ---------- bottom panel ---------- */
.panel{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.8cqh;padding:9cqh 6cqw 3.2cqh;text-align:center;pointer-events:none;background:linear-gradient(to top,rgba(14,8,5,.96) 0%,rgba(14,8,5,.86) 58%,rgba(14,8,5,0) 100%);}
.panel > *{pointer-events:auto;}
.say{margin:0;min-height:1.6em;font:400 min(4.8cqw,2.6cqh)/1.65 var(--kai);color:var(--mist);text-wrap:pretty;}
.meter{display:none;width:58cqw;height:4px;border-radius:2px;background:rgba(245,241,230,.2);overflow:hidden;}
.frame[data-step="shake"] .meter{display:block;}
.meter b{display:block;height:100%;background:var(--gold-soft);transform:scaleX(0);transform-origin:left;}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:2.2cqw;min-height:46px;}
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;height:46px;padding:0 24px;border-radius:999px;border:0;font:700 17px/1 var(--kai);letter-spacing:.08em;cursor:pointer;touch-action:manipulation;-webkit-touch-callout:none;}
.btn.primary{background:var(--gold);color:#2A1A0A;box-shadow:0 6px 20px rgba(0,0,0,.35);}
.btn.chip{height:42px;padding:0 17px;font-weight:400;font-size:16px;background:rgba(245,241,230,.08);color:var(--mist);border:1px solid rgba(245,241,230,.38);}
.btn.chip:hover{background:rgba(245,241,230,.16);}
.btn:disabled{opacity:.62;cursor:default;}
.btn.wait::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.4);transform-origin:left;animation:fillw 2.6s linear both;}
@keyframes fillw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.btn.hold{padding:0 30px;touch-action:none;}
.btn.hold.on{transform:scale(.96);background:var(--gold-soft);}
button:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;}
@container (max-width:340px){.btn.chip{padding:0 12px;font-size:15px;}.steps{gap:1.8cqw;}}

/* ---------- 籤文 card ---------- */
.cardwrap{position:absolute;inset:0;z-index:8;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,8,8,.55);opacity:0;visibility:hidden;transition:opacity .4s ease,visibility 0s linear .4s;}
.cardwrap.show{opacity:1;visibility:visible;transition:opacity .4s ease,visibility 0s;}
.card{width:94cqw;max-height:calc(100cqh - 10cqh);overflow:auto;margin-bottom:2.5cqh;padding:6cqw 6cqw 5cqw;border-radius:1.6cqw;color:#2B1D12;background:var(--grain) repeat local,#F2E4BC;box-shadow:inset 0 0 0 1cqw #F2E4BC,inset 0 0 0 1.35cqw var(--vermilion),0 2cqh 6cqh rgba(0,0,0,.5);transform:translateY(10cqh);transition:transform .55s cubic-bezier(.2,.7,.2,1);overscroll-behavior:contain;}
.cardwrap.show .card{transform:none;}
.c-head{margin:0 0 3cqw;text-align:center;font:400 3.6cqw/1 var(--kai);letter-spacing:.24em;color:var(--vermilion);}
.c-no{display:flex;align-items:center;justify-content:center;gap:3cqw;}
.c-no h2{margin:0;font:900 min(10cqw,5.4cqh)/1 var(--display);letter-spacing:.06em;}
.c-grade{font:900 4.6cqw/1 var(--display);letter-spacing:.1em;color:var(--gold-soft);background:var(--vermilion);padding:1.5cqw 2.2cqw;border-radius:.8cqw;}
.c-title{margin:3cqw 0 3.5cqw;text-align:center;font:700 5cqw/1 var(--kai);color:#6A4420;}
.c-poemwrap{display:flex;justify-content:center;padding:4cqw 0;border-top:1px solid rgba(168,38,28,.45);border-bottom:1px solid rgba(168,38,28,.45);}
.c-poem{writing-mode:vertical-rl;white-space:nowrap;height:max-content;font:700 min(6.6cqw,3.4cqh)/2 var(--kai);letter-spacing:.14em;}
.c-poem p{margin:0;}
.c-ask{margin:3.8cqw 0 0;font:400 min(4.5cqw,2.4cqh)/1.7 var(--kai);}
.c-ask b{margin-right:1.6cqw;font-weight:700;color:var(--vermilion);}
.c-ref{display:block;margin-top:1.2cqw;color:rgba(43,29,18,.78);}
.c-label{margin:4.6cqw 0 2cqw;padding-left:.3em;text-align:center;font:700 3.8cqw/1 var(--kai);letter-spacing:.3em;color:var(--vermilion);}
.c-xj{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw 2cqw;font:400 min(4.2cqw,2.2cqh)/1.6 var(--kai);text-align:center;}
.c-xj span{border-radius:.8cqw;padding:.4cqw 0;}
.c-xj span.hit,.c-ys .hit{color:var(--vermilion);font-weight:700;}
.c-xj span.hit{background:rgba(168,38,28,.09);}
.c-ys{display:grid;grid-template-columns:auto auto;justify-content:center;gap:.6cqw 3.2cqw;margin:0;font:400 min(4cqw,2.1cqh)/1.6 var(--kai);}
.c-ys dt{color:rgba(43,29,18,.62);}
.c-ys dd{margin:0;}
.c-note,.c-foot{margin:3cqw 0 0;font:400 3.4cqw/1.6 var(--kai);color:rgba(43,29,18,.66);}
.card .btn{width:100%;margin-top:4.5cqw;}

/* ---------- intro ---------- */
.intro{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2.2cqh;padding:0 7cqw 9cqh;text-align:center;background:linear-gradient(to top,rgba(10,6,4,.95) 0%,rgba(10,6,4,.8) 45%,rgba(10,6,4,.15) 75%,rgba(10,6,4,0) 100%);transition:opacity .5s ease,visibility 0s;}
.intro.gone{opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s;}
.i-title{margin:0;font:900 min(12cqw,6.2cqh)/1 var(--display);letter-spacing:.14em;margin-right:-.14em;color:var(--gold-soft);text-shadow:0 0 4cqw rgba(230,178,74,.35);}
.i-sub{margin:-.6cqh 0 0;font:700 min(5.2cqw,2.8cqh)/1 var(--kai);letter-spacing:.3em;margin-right:-.3em;color:var(--mist);}
.i-flow{margin:0;font:400 min(3.9cqw,2.1cqh)/1.6 var(--kai);letter-spacing:.14em;color:rgba(245,241,230,.72);}
.i-fine{margin:0;font:400 13px/1.6 var(--kai);color:rgba(245,241,230,.6);}

@media (prefers-reduced-motion:reduce){
  .haze,.puff,.flame,.halo,.tip,.incense.lit .tipI,.tube.shaking .st{animation:none!important;}
  .tube.shaking{animation-duration:.4s;}
}
</style>
</head>
<body>
<main class="stage-wrap">
<div class="frame" id="frame" data-step="intro" role="application" aria-label="黃大仙靈籤模擬求籤">

  <div class="sky"></div>

  <!-- the main hall with the deity inside -->
  <svg class="hall" viewBox="0 60 400 250" aria-hidden="true">
    <defs>
      <radialGradient id="hInt" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#8A3A1E"/><stop offset=".6" stop-color="#4A1510"/><stop offset="1" stop-color="#240907"/></radialGradient>
      <radialGradient id="hHalo"><stop offset="0" stop-color="#FFE3A0" stop-opacity=".95"/><stop offset=".5" stop-color="#F0B64E" stop-opacity=".45"/><stop offset="1" stop-color="#F0B64E" stop-opacity="0"/></radialGradient>
      <linearGradient id="hRoof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C862"/><stop offset="1" stop-color="#B57C28"/></linearGradient>
      <linearGradient id="hRobe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A8741F"/><stop offset=".5" stop-color="#F0C45C"/><stop offset="1" stop-color="#A8741F"/></linearGradient>
      <pattern id="hTile" width="9" height="200" patternUnits="userSpaceOnUse"><rect width="1.3" height="200" fill="#8E6020" opacity=".45"/></pattern>
    </defs>
    <rect x="0" y="300" width="400" height="10" fill="#7A6D5E"/>
    <rect x="92" y="196" width="216" height="98" fill="url(#hInt)"/>
    <circle class="halo" cx="200" cy="246" r="36" fill="url(#hHalo)"/>
    <g>
      <path d="M176 292Q178 262 190 254L210 254Q222 262 224 292Z" fill="url(#hRobe)"/>
      <path d="M187 258Q180 272 186 283L198 280Z" fill="#C38E34"/>
      <path d="M213 258Q220 272 214 283L202 280Z" fill="#C38E34"/>
      <ellipse cx="200" cy="281" rx="12" ry="4" fill="#B57C28"/>
      <circle cx="200" cy="245" r="7.5" fill="#EBC47C"/>
      <path d="M195.5 249Q200 262 204.5 249Z" fill="#2E2219"/>
      <rect x="194" y="233" width="12" height="5" rx="1.5" fill="#6A2E10"/>
      <rect x="198" y="229" width="4" height="5" rx="1" fill="#E6B24A"/>
    </g>
    <rect x="152" y="278" width="96" height="3" fill="#E6B24A"/>
    <rect x="156" y="281" width="88" height="13" fill="#7E1A13"/>
    <rect x="166" y="266" width="4" height="12" fill="#EFE3CC"/><rect x="230" y="266" width="4" height="12" fill="#EFE3CC"/>
    <ellipse class="flame" cx="168" cy="262.5" rx="2.2" ry="4" fill="#FFC46B"/>
    <ellipse class="flame" cx="232" cy="262.5" rx="2.2" ry="4" fill="#FFC46B"/>
    <path d="M92 196H116Q108 230 112 262Q100 250 92 250Z" fill="#D9A62E" opacity=".92"/>
    <path d="M308 196H284Q292 230 288 262Q300 250 308 250Z" fill="#D9A62E" opacity=".92"/>
    <rect x="92" y="196" width="216" height="7" fill="#E0B23C"/>
    <line x1="97" y1="203" x2="305" y2="203" stroke="#E0B23C" stroke-width="10" stroke-linecap="round" stroke-dasharray="0.1 18"/>
    <g fill="#9E2218"><rect x="94" y="196" width="12" height="98"/><rect x="146" y="196" width="12" height="98"/><rect x="242" y="196" width="12" height="98"/><rect x="294" y="196" width="12" height="98"/></g>
    <rect x="84" y="188" width="232" height="12" fill="#1E5A60"/>
    <line x1="92" y1="194" x2="308" y2="194" stroke="#E6B24A" stroke-width="3" stroke-dasharray="3 11" stroke-linecap="round"/>
    <path d="M28 164Q60 190 90 190L310 190Q340 190 372 164Q330 170 290 136L110 136Q70 170 28 164Z" fill="url(#hRoof)"/>
    <path d="M28 164Q60 190 90 190L310 190Q340 190 372 164Q330 170 290 136L110 136Q70 170 28 164Z" fill="url(#hTile)"/>
    <path d="M28 164Q60 190 90 190L310 190Q340 190 372 164" fill="none" stroke="#6E4A14" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="128" y="128" width="144" height="10" fill="#7E1A13"/>
    <rect x="176" y="129" width="48" height="8" fill="#1E5A60" stroke="#E6B24A" stroke-width="1"/>
    <path d="M78 110Q100 132 125 132L275 132Q300 132 322 110Q290 114 255 90L145 90Q110 114 78 110Z" fill="url(#hRoof)"/>
    <path d="M78 110Q100 132 125 132L275 132Q300 132 322 110Q290 114 255 90L145 90Q110 114 78 110Z" fill="url(#hTile)"/>
    <path d="M78 110Q100 132 125 132L275 132Q300 132 322 110" fill="none" stroke="#6E4A14" stroke-width="2" stroke-linecap="round"/>
    <rect x="138" y="83" width="124" height="8" rx="2" fill="#C98E2F"/>
    <path d="M140 91C128 88 126 78 132 70C134 78 139 82 146 84Z" fill="#C98E2F"/>
    <path d="M260 91C272 88 274 78 268 70C266 78 261 82 254 84Z" fill="#C98E2F"/>
    <circle cx="200" cy="76" r="6.5" fill="#F3D58E"/>
    <rect x="56" y="292" width="288" height="9" fill="#8A7F72"/>
    <line x1="60" y1="288" x2="160" y2="288" stroke="#9C9082" stroke-width="7" stroke-dasharray="4 8"/>
    <line x1="240" y1="288" x2="340" y2="288" stroke="#9C9082" stroke-width="7" stroke-dasharray="4 8"/>
  </svg>

  <!-- courtyard paving -->
  <svg class="plaza" viewBox="0 0 400 400" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="pz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A6D5E"/><stop offset=".45" stop-color="#57493C"/><stop offset="1" stop-color="#2A211B"/></linearGradient></defs>
    <rect width="400" height="400" fill="url(#pz)"/>
    <g stroke="#1E1610" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke">

    '姻緣': p => /婚|姻|偶|耦/.test(p),
    '健康': p => /病|疾|醫/.test(p),
    '家宅': p => /宅|家/.test(p),
    '學業': p => /名|功/.test(p),
    '出行': p => p.startsWith('行') || p.includes('行人') || p === '出行阻'
  };
  const YS_HIT = { '健康': '自身', '出行': '出行', '家宅': '風水' };

  function showCard() {
    const s = STICKS[S.n - 1];
    const esc = t => String(t).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    const test = HIT[S.cat];
    let hits = s.pairs.filter(([a, b]) => test(a) || test(b));
    if (!hits.length) hits = s.pairs.filter(([a, b]) => /謀/.test(a + b));
    const ysKey = YS_HIT[S.cat];
    const ysHit = ysKey ? s.ys.find(([k]) => k === ysKey) : null;
    const quote = [...hits.map(([a, b]) => `${a}，${b}`), ...(ysHit ? [`問${ysHit[0]}：${ysHit[1]}`] : [])].join('；');
    card.innerHTML =
      `<p class="c-head">黃大仙靈籤　模擬求籤</p>` +
      `<div class="c-no"><h2>第${cn(S.n)}籤</h2><span class="c-grade">${esc(s.g)}</span></div>` +
      `<p class="c-title">〈${esc(s.t)}〉</p>` +
      `<div class="c-poemwrap"><div class="c-poem">${s.p.map(l => `<p>${esc(l)}</p>`).join('')}</div></div>` +
      `<p class="c-ask"><b>問${esc(S.cat)}</b>${quote ? `籤示「${esc(quote)}」。` : ''}<span class="c-ref">參考：${esc(ADV[S.cat][s.g])}</span></p>` +
      (S.cat === '健康' ? `<p class="c-note">身體狀況請以醫生意見為準。</p>` : '') +
      `<p class="c-label">仙機</p>` +
      `<div class="c-xj">${s.pairs.map(([a, b]) => `<span class="${(test(a) || test(b)) ? 'hit' : ''}">${esc(a)}。${esc(b)}。</span>`).join('')}</div>` +
      `<p class="c-label">運勢</p>` +
      `<dl class="c-ys">${s.ys.map(([k, v]) => `<dt class="${k === ysKey ? 'hit' : ''}">問${esc(k)}</dt><dd class="${k === ysKey ? 'hit' : ''}">${esc(v)}</dd>`).join('')}</dl>` +
      `<p class="c-foot">同一件事，一日求一次就夠。籤文據傳統黃大仙靈籤，各版本字眼或有出入；模擬求籤僅供娛樂參考，正式解籤請親臨黃大仙祠。</p>`;
    const again = btn('再問一件事', 'primary', () => { S.cat = null; setStep('ask'); });
    card.appendChild(again);
    card.scrollTop = 0;
    sayText('');
    setActs();
    cardWrap.classList.add('show');
    try { card.focus({ preventScroll: true }); } catch (e) {}
  }

  $('begin').addEventListener('click', () => {
    audio(); enableMotion();
    intro.classList.add('gone');
    setStep('ask');
  });
})();
</script>
</body>
</html>
